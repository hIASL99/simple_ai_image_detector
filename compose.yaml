services:
  aidetect:
    image: matthiaswindisch/simple_ai_image_detector:0.1.0
    # Build locally instead of pulling. MODEL_DIR=models adds the CC-BY-NC
    # member (0.0008 AUROC better, not redistributable); BAKE_MODELS=false
    # builds a ~1.5 GB image with no weights, to be paired with the volume
    # mount below.
    # build:
    #   context: .
    #   args:
    #     MODEL_DIR: models_permissive
    #     BAKE_MODELS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # 0 lets the detector pick the physical core count, which measured about
      # twice as fast as using every SMT thread.
      AIDETECT_THREADS: "0"
      AIDETECT_OPERATING_POINT: "fpr5"
      AIDETECT_MAX_BYTES: "33554432"
      AIDETECT_MAX_FILES: "16"
    # volumes:
    #   - ./hf-cache:/opt/models:ro   # with BAKE_MODELS=false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      # The ensemble takes a few seconds to load; without this an orchestrator
      # kills the container before it is ever ready.
      start_period: 90s
      retries: 3
    restart: unless-stopped
